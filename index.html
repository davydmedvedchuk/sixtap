<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Sixtap: 6 taps and the price is ready. A phone-first estimator for kitchens, bathrooms and installation.">
<meta name="theme-color" content="#f3f2ec">
<title>Sixtap</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Jost:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout idea: a phone app. Home with category tiles and a bottom bar whose centre button starts a one-question-per-screen flow (big cards, big buttons, price at the end). Detail screens sit behind each tile. Two looks via data-look (eng light, night dark); no brand marks of other apps. */

:root { --logo-bg:#ff6a1a; --logo-ink:#14181d; }
:root, :root[data-look="eng"] {
  --bg:#f3f2ec; --card:#fbfaf6; --ink:#14181d; --muted:#667079; --line:#cfcdc3;
  --pri:#ff6a1a; --pri-ink:#14181d; --gold:#c2410c; --soft:#efe7de; --soft-ink:#14181d;
  --warn:#8a4310; --warn-bg:#f6e8dc;
  --banner:#14181d; --banner-ink:#ffffff; --cta:#ff6a1a; --on-cta:#14181d; --go-ink:#14181d; --deco:#ff6a1a;
  --edge:rgba(20,24,29,.28);
  --c-eco:#c9d3d6; --c-mid:#d9c9a6; --c-pro:#7d6a52; --wood:#a67c52; --glass:rgba(150,190,205,.38); --stone:#d6d0c4; --stone2:#3f4348; --splash:#b9c4c0; --wall:#e9e7df; --floor:#b7ad99; --counter:#6b7075; --plinth:#2b2e32; --handle:#d0d3d7;
  --rs:10px; --rb:18px; --rp:999px; --rc:50%; --shadow:none; --bw:1px; --f-num:"IBM Plex Mono",ui-monospace,monospace;
  --f-display:"Barlow Condensed","IBM Plex Sans",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --dw:600; --dt:uppercase; --ds:1.12; color-scheme:light;
}
/* night = same shapes and type, only colours change */
:root[data-look="night"] {
  --bg:#0c0f12; --card:#161b21; --ink:#f1f3f5; --muted:#98a2ad; --line:#2d353f;
  --pri:#ff6a1a; --pri-ink:#14181d; --gold:#ff8a45; --soft:#232a32; --soft-ink:#ffb58a;
  --warn:#ffb27a; --warn-bg:#2f2218;
  --banner:#1a1f26; --banner-ink:#f1f3f5; --cta:#ff6a1a; --on-cta:#14181d; --go-ink:#14181d; --deco:#ff6a1a;
  --edge:rgba(241,243,245,.30);
  --c-eco:#5b7a78; --c-mid:#9c7a4e; --c-pro:#6d4f35; --wood:#8a5f3a; --glass:rgba(120,170,190,.30); --stone:#323b45; --stone2:#aab0b6; --splash:#3d4a4c; --wall:#1d2329; --floor:#4a4339; --counter:#8a9096; --plinth:#07090b; --handle:#c9ccd0;
  color-scheme:dark;
}
* { box-sizing: border-box; }
html, body, button, a, input, select, label { touch-action: manipulation; }
html { -webkit-text-size-adjust: 100%; overflow-x: hidden; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 120px; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
#app { max-width: 480px; margin: 0 auto; }
.view { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
h1, h2, h3 { font-family: var(--f-display); font-weight: var(--dw); text-transform: var(--dt); margin: 0; letter-spacing: -.01em; }
h1 { font-size: calc(26px * var(--ds)); line-height: 1.15; font-weight: 700; }
h2 { font-size: 18px; font-weight: 600; }
label, .lab { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
input[type="text"], input[type="tel"], select { width: 100%; min-width: 0; font: 600 16px var(--f-body); color: var(--ink); background: var(--card); border: var(--bw) solid var(--line); border-radius: var(--rs); padding: 10px 12px; font-variant-numeric: tabular-nums; }
input:disabled { opacity: .5; }
input:focus-visible, select:focus-visible, button:focus-visible, summary:focus-visible, a:focus-visible { outline: 2.5px solid var(--gold); outline-offset: 2px; }
button { font: 600 15px var(--f-body); cursor: pointer; border-radius: var(--rs); padding: 11px 16px; border: var(--bw) solid var(--line); background: var(--card); color: var(--ink); }
button:disabled { opacity: .4; cursor: default; }
button.pri { background: var(--pri); border-color: var(--pri); color: var(--pri-ink); }
button.link { border: 0; background: transparent; color: var(--gold); padding: 8px 4px; }
.icon { padding: 0; width: 36px; height: 38px; color: var(--muted); font-size: 18px; line-height: 1; border-radius: var(--rs); }
.card { background: var(--card); border-radius: var(--rb); padding: 16px; border: 1px solid var(--line); }
.hint { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
.hint a { color: var(--gold); }
.warn { background: var(--warn-bg); color: var(--warn); border-radius: var(--rs); padding: 10px 12px; font-size: 14px; font-weight: 500; }
[hidden] { display: none !important; }

/* header of subpages */
.vh { display: flex; align-items: center; gap: 10px; }
.vh .back { width: 40px; height: 40px; padding: 0; border-radius: var(--rc); font-size: 20px; line-height: 1; flex: none; }
.vh h1 { font-size: 22px; }

/* home */
.brand { display: flex; justify-content: space-between; align-items: center; font: 700 12px var(--f-display); letter-spacing: .16em; color: var(--gold); text-transform: uppercase; }
.banner { background: var(--banner); color: var(--banner-ink); border-radius: var(--rb); padding: 20px; display: flex; flex-direction: column; gap: 6px; position: relative; overflow: hidden; }
.banner h2 { font-size: calc(24px * var(--ds)); line-height: 1.15; max-width: 14ch; }
.banner p { margin: 0 0 8px; font-size: 14px; opacity: .85; max-width: 26ch; }
.banner .cta { align-self: flex-start; background: var(--cta); color: var(--on-cta); border: 0; font-weight: 700; padding: 12px 20px; border-radius: var(--rp); }
.banner svg.deco { position: absolute; right: -14px; bottom: -18px; width: 150px; height: 150px; color: var(--deco); opacity: .16; }
.last { font-size: 13px; opacity: .85; margin-top: 8px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--rb); padding: 14px; min-height: 132px; }
.tile .ic { width: 56px; height: 56px; border-radius: var(--rc); background: var(--soft); color: var(--soft-ink); display: grid; place-items: center; }
.tile .ic svg { width: 32px; height: 32px; }
.tile b { font: 600 16px var(--f-display); }
.tile small { color: var(--muted); font-size: 12px; font-weight: 500; margin-top: -8px; }
.tile.soon { border-style: dashed; background: transparent; color: var(--muted); }
.tile.soon .ic { background: transparent; border: 1.5px dashed var(--line); }

/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--card); border-top: 1px solid var(--line); padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.tabs .in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: 1fr 84px 1fr; align-items: end; }
.tabs .tb { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--muted); padding: 6px 0; }
.tabs .tb svg { width: 26px; height: 26px; }
.tabs .tb[aria-current="page"] { color: var(--ink); }
.tabs .go { width: 60px; height: 60px; margin: -16px auto 0; border-radius: var(--rc); padding: 0; background: var(--pri); border: 4px solid var(--card); color: var(--go-ink); display: grid; place-items: center; box-shadow: var(--shadow); }
.tabs .go svg { width: 32px; height: 32px; }
.tabs .gl { grid-column: 2; text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 2px; }

/* quick flow */
.qtop { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.qtop .back, .qtop .close { width: 40px; height: 40px; padding: 0; border-radius: var(--rc); font-size: 20px; line-height: 1; }
.dots { display: flex; gap: 6px; }
.dots i { width: 22px; height: 5px; border-radius: 3px; background: var(--line); }
.dots i.on { background: var(--gold); }
.qh { font: var(--dw) calc(32px * var(--ds))/1.1 var(--f-display); text-transform: var(--dt); letter-spacing: -.02em; margin: 12px 0 2px; }
.qs { color: var(--muted); font-size: 15px; margin: 0; }
.car { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 18px -16px 0; padding: 4px 16px 14px; scrollbar-width: none; }
.car::-webkit-scrollbar { display: none; }
.sc { flex: 0 0 74%; scroll-snap-align: center; text-align: left; border-radius: var(--rb); padding: 22px 20px; min-height: 210px; display: flex; flex-direction: column; justify-content: space-between; border: calc(var(--bw) + .5px) solid var(--line); background: var(--card); }
.sc[aria-pressed="true"] { border-color: var(--gold); }
.sc .sw { width: 54px; height: 54px; border-radius: var(--rc); border: 1px solid rgba(0,0,0,.2); }
.sc b { font: 700 28px var(--f-display); display: block; }
.sc span.pp { color: var(--muted); font-size: 14px; font-weight: 500; }
.big2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px; }
.bb { border-radius: var(--rb); min-height: 150px; font: 700 24px var(--f-display); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 14px; border: calc(var(--bw) + .5px) solid var(--line); }
.bb small { font: 500 13px var(--f-body); color: var(--muted); }
.bb[aria-pressed="true"] { border-color: var(--gold); }
.bb.yes { background: var(--pri); color: var(--pri-ink); border-color: var(--pri); }
.big4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 22px; }
.big4 .bb { min-height: 110px; font-size: 30px; }
.lenbox { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
.round { width: 72px; height: 72px; border-radius: var(--rc); padding: 0; font: 600 32px var(--f-body); line-height: 1; }
.lenv { text-align: center; font: var(--dw) calc(44px * var(--ds)) var(--f-display); letter-spacing: -.02em; }
.lenv small { display: block; font: 500 13px var(--f-body); color: var(--muted); letter-spacing: 0; }
.chips { display: flex; gap: 8px; justify-content: center; margin: 14px 0; flex-wrap: wrap; }
.chips button { border-radius: var(--rp); padding: 8px 14px; }
.chips button[aria-pressed="true"] { background: var(--soft); border-color: var(--gold); }
.next { width: 100%; padding: 16px; font-size: 17px; border-radius: var(--rs); margin-top: 6px; }
.res { text-align: center; padding: 22px 16px; }
.res .tt { font: var(--dw) calc(48px * var(--ds))/1.05 var(--f-display); letter-spacing: -.02em; margin: 6px 0; }
.res .rg { color: var(--muted); font-weight: 600; }
.res .lbl { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.rl { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-weight: 500; }
.rl:last-child { border-bottom: 0; }
.rl .v { font-weight: 700; white-space: nowrap; }
.rl .v.off { color: var(--muted); font-weight: 500; }
.rl-wrap { text-align: left; margin-top: 12px; }
.rrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }

/* kitchen detail */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: var(--rb); padding: 8px 8px 8px 16px; box-shadow: var(--shadow); }
.tot .k { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.tot .v { display: block; font: 700 26px/1.05 var(--f-display); white-space: nowrap; }
.tot .r { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; font-weight: 500; }
.seg { display: flex; background: var(--soft); border-radius: var(--rs); padding: 3px; flex: none; }
.seg button { border: 0; background: transparent; border-radius: var(--rs); padding: 9px 9px; font-size: 12px; color: var(--soft-ink); }
.seg button[aria-pressed="true"] { background: var(--pri); color: var(--pri-ink); }
.pic { background: var(--card); border: 1px solid var(--line); border-radius: var(--rb); padding: 10px 10px 2px; overflow: hidden; }
.pic svg { display: block; width: 100%; height: auto; max-width: 100%; }
.pic .empty { padding: 36px 10px; text-align: center; color: var(--muted); font-size: 14px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.row .nm { font-weight: 600; }
.row .sub { grid-column: 1; font-size: 12px; color: var(--muted); font-weight: 500; }
.stp { grid-column: 2; grid-row: 1 / span 2; display: grid; grid-template-columns: 40px 78px 40px; gap: 6px; align-items: center; }
.stp button { height: 40px; padding: 0; font-size: 20px; border-radius: var(--rs); }
.stp input { text-align: center; height: 40px; padding: 4px; }
.same { display: flex; gap: 10px; align-items: center; font-size: 14px; padding: 12px 0 0; margin: 0; color: var(--ink); font-weight: 500; }
input[type="checkbox"] { width: 20px; height: 20px; margin: 0; accent-color: var(--gold); flex: none; }
.grp { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 14px 0 2px; }
.ln { padding: 9px 0; border-bottom: 1px solid var(--line); }
.ln-top { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto 36px; gap: 10px; align-items: center; }
.ln-top.nocb { grid-template-columns: minmax(0, 1fr) auto 36px; }
.ln-top .nm { font: 600 15px var(--f-body); border: 0; background: transparent; padding: 4px 0; border-radius: 6px; }
.ln-top .nm:focus { background: var(--card); padding: 4px 8px; }
.ln-top .amt { font-weight: 700; white-space: nowrap; text-align: right; }
.ln-top .amt.off { color: var(--muted); font-weight: 500; }
.ln-sub { display: flex; align-items: center; gap: 6px; margin: 4px 0 0 32px; font-size: 12px; color: var(--muted); flex-wrap: wrap; font-weight: 500; }
.nocbs .ln-sub { margin-left: 0; }
.ln-sub input { width: 74px; padding: 5px 8px; font-size: 14px; border-radius: var(--rs); }
.ln.off .nm, .ln.off .amt { opacity: .5; }
.tl { display: flex; flex-direction: column; gap: 8px; }
.tl .line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-weight: 500; }
.tl .val { font-weight: 700; }
.tl .big { border-top: 2px solid var(--ink); padding-top: 10px; font: 700 20px var(--f-display); }
.tl .big .val { font-size: 26px; }
.fields3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.pt { display: grid; grid-template-columns: 62px repeat(3, minmax(0, 1fr)); gap: 8px; align-items: center; }
.pt .h { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.pt input { padding: 9px 6px; font-size: 15px; text-align: right; }
.chip { display: inline-block; font: 700 10px var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--warn); background: var(--warn-bg); padding: 2px 8px; border-radius: var(--rp); margin-left: 6px; vertical-align: middle; }
.past { display: grid; grid-template-columns: minmax(0, 1fr) 58px 76px 66px 36px; gap: 6px; align-items: center; padding: 5px 0; }
.past input { padding: 8px 6px; font-size: 14px; }
.past .pm { font-size: 12px; color: var(--muted); text-align: right; font-weight: 500; }
.status { min-height: 1.3em; font-size: 12px; color: var(--muted); }
.sec { display: flex; flex-direction: column; gap: 10px; }

.ctl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-items: end; }
.looks { display: flex; gap: 3px; background: var(--soft); padding: 3px; border-radius: var(--rp); width: 100%; height: 44px; }
.looks button { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; color: var(--soft-ink); border-radius: var(--rp); padding: 0 8px; font-size: 14px; font-weight: 600; text-transform: none; letter-spacing: 0; }
.looks button[aria-pressed="true"] { background: var(--pri); color: var(--pri-ink); }
.brand .looks { font-family: var(--f-body); }
.brand { text-transform: none; letter-spacing: 0; }
.wm { display: flex; align-items: center; gap: 12px; color: var(--ink); }
.wm span { font: var(--dw) 26px/1 var(--f-display); letter-spacing: -.01em; text-transform: var(--dt); }
.wm svg { flex: none; display: block; }
/* iOS zooms the page when a field under 16px gets focus, so every field is at least 16px */
input, select, textarea { font-size: 16px !important; }
.langsel { width: 100%; min-width: 0; height: 44px; border-radius: var(--rp); background: var(--soft); color: var(--soft-ink); border-color: transparent; padding: 0 14px; font-weight: 600; }

/* blueprint look: mono figures, graph-paper banner, title block */
.res .tt, .lenv, .tot .v, .rl .v, .tl .val, .ln-top .amt, .pt input, .stp input, .past .pm { font-family: var(--f-num); }
.res .tt { letter-spacing: -.04em; font-weight: 600; }
.lenv { font-weight: 600; letter-spacing: -.04em; }
.banner { background-image: linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px); background-size: 20px 20px; background-position: -1px -1px; }
.card, .tile, .pic { border-color: var(--edge); }
.tile .ic, .sc .sw { border: 1px solid var(--ink); background: transparent; }
.tabs .go { border-width: 3px; }
.tblk { border-radius: 10px; overflow: hidden; display: grid; grid-template-columns: 1.15fr 1.05fr 1fr; margin-top: 16px; border: 1px solid var(--ink); text-align: left; }
.tblk > div { padding: 6px 9px; min-width: 0; border-left: 1px solid var(--ink); }
.tblk > div:first-child { border-left: 0; display: flex; align-items: center; }
.tblk .k { display: block; font: 500 9px var(--f-num); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tblk .v { display: block; font: 600 13px var(--f-num); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tblk .wm span { font-size: 15px; }
.res .tt, .tot .v { word-spacing: -.3em; }
.tot .v { font-size: 22px; }
.seg { min-width: 0; }
.seg button { padding: 9px 5px; font-size: 11px; letter-spacing: 0; white-space: nowrap; }
.tot { min-width: 0; flex: 0 1 auto; }
:root[data-look="night"] .banner { border: 1px solid var(--line); }
:root[data-look="night"] .banner svg.deco { opacity: .12; }
</style>

<body>
<div id="app">
  <section class="view" id="v-home"></section>
  <section class="view" id="v-quick" hidden></section>
  <section class="view" id="v-setup" hidden></section>
  <section class="view" id="v-bq" hidden></section>
  <section class="view" id="v-mq" hidden></section>
  <section class="view" id="v-kitchen" hidden></section>
  <section class="view" id="v-bath" hidden></section>
  <section class="view" id="v-mount" hidden></section>
  <section class="view" id="v-prices" hidden></section>
</div>

<script>
(function () {
  var SEGS = [['eco', 'Базовый'], ['mid', 'Стандарт'], ['pro', 'Расширенный']];
  var ROUTES = ['home', 'setup', 'quick', 'bq', 'mq', 'kitchen', 'bath', 'mount', 'prices'];
  var STORE = 'quick-price-v1';
  var LOOKS = [['eng','Чертёж'],['night','Ночь']];

  /* ---------- router ---------- */
  function show(name) {
    if (ROUTES.indexOf(name) < 0) name = 'home';
    cur = name;
    ROUTES.forEach(function (r) { $('v-' + r).hidden = r !== name; });
    if (name === 'quick') { built.quick = true; renderQuick(); }
    else if (name === 'bq') { built.bq = true; renderBQ(); }
    else if (name === 'setup') { built.setup = true; renderSetup(); }
    else if (name === 'mq') { built.mq = true; renderMQ(); }
    else if (!built[name]) { builders[name](); built[name] = true; }
    if (refreshers[name]) refreshers[name]();
    if (name === 'home') { curSaved = null; renderSaved(); }
    markTabs(); var fl = (name === 'quick' || name === 'bq' || name === 'mq' || name === 'setup'); $('tabs').hidden = fl; document.body.style.paddingBottom = fl ? '32px' : ''; window.scrollTo(0, 0);
  }
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (g) { document.addEventListener(g, function (e) { e.preventDefault(); }, { passive: false }); });

  document.documentElement.lang = LANG; if (!state.ob && !location.hash) location.hash = 'setup'; show(location.hash.slice(1)); applyLook();

  (window.claude && window.claude.use ? window.claude.use('db') : Promise.resolve(null)).then(function (d) {
    if (!d) return;
    d.doc('quick/state').get().then(function (snap) {
      if (DEMO) { db = null; return; }
      if (snap.exists) { state = normalize(JSON.parse(JSON.stringify(snap.data()))); try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} LANG = state.lang; document.documentElement.lang = LANG === 'uk' ? 'uk' : LANG; built = {}; kRefs = {}; mRefs = {}; bRefs = {}; buildTabs(); if (state.ob && cur === 'setup') location.hash = 'home'; else if (!state.ob && cur === 'home' && !location.hash.slice(1)) location.hash = 'setup'; else show(cur); applyLook(); }
      db = d; if (!snap.exists) persist();
    }, function () { db = null; setStatus(T('Сервер недоступен. Данные сохраняются только в этом браузере.')); });
  }, function () { db = null; });
})();

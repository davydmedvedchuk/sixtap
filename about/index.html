<style>
:root{--bg:#f3f2ec;--card:#fbfaf6;--ink:#14181d;--muted:#667079;--line:#cfcdc3;--pri:#ff6a1a;--gold:#c2410c}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 17px/1.55 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;

a{color:inherit;text-decoration:none}
.c{max-width:1120px;margin:0 auto;padding:0 28px}
nav{display:flex;align-items:center;gap:22px;padding:22px 0}
.brand{display:flex;align-items:center;gap:12px;font:600 15px "IBM Plex Mono",monospace;letter-spacing:.32em}
.brand img{width:44px;height:33px}
.links{display:flex;gap:22px;margin-left:auto;font-size:15px;color:var(--muted)}
.lang{display:flex;gap:2px;border:1.5px solid var(--ink);border-radius:999px;padding:3px}
.lang button{font:600 12px "IBM Plex Mono",monospace;border:0;background:none;color:var(--ink);padding:5px 9px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;height:52px;padding:0 26px;border-radius:10px;font:600 17px "IBM Plex Sans",sans-serif;border:2px solid var(--ink)}
.btn.go{background:var(--pri);color:var(--ink)}
.btn.line{background:transparent}
.btn.sm{height:42px;padding:0 18px;font-size:15px}
h1,h2,h3{font-family:"Barlow Condensed","IBM Plex Sans",sans-serif;text-transform:uppercase;font-weight:600;line-height:.98}
h1{font-size:clamp(56px,8vw,104px);letter-spacing:.2px}
h1 em{font-style:normal;color:var(--pri)}
h2{font-size:clamp(38px,5vw,56px);margin-bottom:12px}
h3{font-size:25px;line-height:1.05;margin-bottom:6px}
.kicker{font:500 13px "IBM Plex Mono",monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.hero{padding:34px 0 0}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:30px;align-items:start}
.lead{font-size:20px;color:var(--muted);max-width:520px;margin:20px 0 28px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.tags{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.tags span{font:500 13px "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;border:2px solid var(--ink);border-radius:8px;padding:7px 12px}
.tags span:first-child{background:var(--pri)}
.steps6{display:flex;align-items:center;gap:0;margin-top:30px;flex-wrap:wrap}
.steps6 b{width:40px;height:40px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font:600 16px "IBM Plex Mono",monospace;background:var(--bg)}
.steps6 i{width:10px;border-top:2px dashed var(--ink)}
.steps6 b:last-of-type{background:var(--pri)}
.steps6 .sum{margin-left:14px;background:var(--ink);color:#fff;border-radius:6px;padding:7px 14px;font:500 20px "IBM Plex Mono",monospace;width:auto;height:auto;border:0}

/* the one iPhone: same frame as the banners */
.phone{width:300px;height:651px;margin:0 auto -90px;background:#07080a;border:2px solid #4a525c;border-radius:54px;padding:8px;box-shadow:0 40px 70px rgba(20,24,29,.28),inset 0 0 0 1px #1d2228;position:relative;z-index:2}
.screen{width:100%;height:100%;border-radius:45px;overflow:hidden;background:#f3f2ec;position:relative}
.screen img.app{position:absolute;left:0;top:34px;width:100%}
.isl{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:86px;height:25px;border-radius:13px;background:#000;z-index:4}
.isl:after{content:"";position:absolute;right:8px;top:8px;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#1b2a44,#05070b)}
.sb{position:absolute;left:0;right:0;top:0;height:34px;z-index:3;color:#14181d;font:600 13px "IBM Plex Sans",sans-serif}
.sb b{position:absolute;left:30px;top:10px}
.sb span{position:absolute;right:24px;top:11px;display:flex;gap:5px;align-items:center}
.pb{position:absolute;width:4px;background:#2c323a;border-radius:2px}

section{padding:84px 0}
.sub{color:var(--muted);max-width:620px;margin-bottom:34px}
.sixgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:var(--card);border:1.5px solid var(--ink);border-radius:14px;padding:22px}
.card .n{display:inline-grid;place-items:center;width:34px;height:34px;border:2px solid var(--ink);border-radius:50%;font:600 15px "IBM Plex Mono",monospace;margin-bottom:12px}
.card p{color:var(--muted);font-size:16px}
.feat{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.feat .card{display:flex;gap:16px}
.feat .card:before{content:"";flex:none;width:10px;height:10px;margin-top:9px;border-radius:50%;background:var(--pri);box-shadow:0 0 0 3px var(--bg),0 0 0 4.5px var(--ink)}
.sample{display:grid;grid-template-columns:.9fr 1.1fr;gap:44px;align-items:center}
.sample img{width:100%;border:1.5px solid var(--ink);border-radius:14px;background:#fff}
.note{margin-top:18px;border-left:4px solid var(--pri);padding:6px 0 6px 16px;color:var(--muted);font-size:16px}
details{border-top:1.5px solid var(--ink);padding:18px 0}
details:last-of-type{border-bottom:1.5px solid var(--ink)}
summary{cursor:pointer;font:600 22px "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.3px;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";font:500 22px "IBM Plex Mono",monospace}
details[open] summary:after{content:"–"}
details p{color:var(--muted);margin-top:10px;max-width:720px}
.final{background:var(--ink);color:#fff;border-radius:20px;padding:56px 44px;display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center}
.final h2{color:#fff;margin:0 0 10px}
.final p{color:#c9ced4}
.final .btn.go{border-color:var(--pri)}
.how2{display:grid;gap:10px;font-size:15px;color:#c9ced4}
.how2 b{color:#fff}
footer{padding:36px 0 50px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a{text-decoration:underline}
@media (max-width:900px){
  .c{padding:0 18px}.links,nav .btn{display:none}.lang{margin-left:auto}
  .hero-grid{grid-template-columns:1fr}
  .phone{transform:scale(.88);transform-origin:top center;margin-bottom:-130px}
  .sixgrid,.feat,.sample,.final{grid-template-columns:1fr}
  section{padding:60px 0}.final{padding:36px 24px}
  .lead{font-size:18px}
}
</style>

const HTMLLANG={en:'en',pt:'pt',ru:'ru',ua:'uk'};
function setLang(l){
  document.documentElement.lang=HTMLLANG[l];
  document.querySelectorAll('[data-t]').forEach(e=>{const v=T[l][e.dataset.t];if(v!=null)e.textContent=v});
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l));
  try{localStorage.setItem('sixtap-about-lang',l)}catch(e){}
}
let l='en';
try{l=localStorage.getItem('sixtap-about-lang')||''}catch(e){}
if(!T[l]){const n=(navigator.language||'en').slice(0,2).toLowerCase();l=n==='pt'?'pt':n==='ru'?'ru':n==='uk'?'ua':'en'}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.l)));
setLang(l);
</script>
